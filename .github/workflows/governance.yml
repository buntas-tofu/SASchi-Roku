name: Governance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  drift:
    name: Invariant linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run the DMF invariant linter
        # kb/evidence holds byte-stable synced copies whose links resolve in
        # the source repository; the stamp gate below protects their
        # integrity. The exemption skips the markdown checks only; the style
        # floor still applies.
        run: python3 scripts/inertia-drift-lint . --ignore evidence

  manifest:
    name: Manifest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install jsonschema
        run: pip install jsonschema
      - name: Validate agent-manifest.json
        run: |
          python <<'PY'
          import json
          from jsonschema import Draft202012Validator

          schema = json.load(open("agent-manifest.schema.json"))
          Draft202012Validator.check_schema(schema)
          print("Schema is well-formed (Draft 2020-12).")

          manifest = json.load(open("agent-manifest.json"))
          errors = sorted(Draft202012Validator(schema).iter_errors(manifest),
                          key=lambda e: e.path)
          if errors:
              for err in errors:
                  path = "/".join(str(p) for p in err.absolute_path) or "(root)"
                  print(f"FAIL: {path}: {err.message}")
              raise SystemExit(1)
          print("Manifest validates against the schema.")
          PY

  index:
    name: Corpus index lockstep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Corpus, TASKS.csv, TASKS.md, and the provenance headers agree
        run: python3 scripts/check_corpus_index.py

  toolkit:
    name: Toolkit integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Catalog records, generated index and compatibility paths
        run: python3 scripts/check_toolkit.py
      - name: Relocation and catalog regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Replay the bounded translation skill trial
        run: python3 trials/sas-translate-sum-array/verify.py

  starter:
    name: Skill starter replay
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
          use-public-rspm: false
      - name: Replay frozen Python and R candidates and verify assessment evidence
        run: python3 trials/starter-batch/verify.py
      - name: Replay dependency, interchange and state proposal evidence
        run: python3 trials/skill-proposals/verify.py
      - name: Replay WHERE and subsetting IF state timing
        run: python3 trials/state-filter-timing/verify.py
      - name: Replay group boundaries, match merges and character widths
        run: python3 trials/state-boundaries/verify.py

  sync:
    name: Synced-copy stamps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Every kb/ copy matches its SOURCE.json stamp
        run: python3 tools/sync_knowledge.py --check

  reference:
    name: Reference determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install poppler for pdftotext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Harvest from the pinned URLs and prove the committed layer reproduces
        run: |
          python3 tools/fetch_sas_reference.py
          git diff --exit-code -- kb/reference/index.json \
            kb/reference/extracted/stmt/entries kb/reference/extracted/dso/entries \
            kb/reference/extracted/stmt/lestmtsref.txt kb/reference/extracted/dso/ledsoptsref.txt

  mcp:
    name: MCP self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install the server subproject
        run: pip install ./mcp
      - name: Self-test against the live kb/ (direct asserts plus in-memory protocol pass)
        env:
          SAS_REF_KB: kb
        run: python -m sas_ref.mcp.selftest

  sanitization:
    name: Sanitization token gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: The tree carries no tokens beyond this instance's allowed identity
        run: python3 scripts/check_sanitization.py buntas
